global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "attendance_backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          application: "attendance-management-backend"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]

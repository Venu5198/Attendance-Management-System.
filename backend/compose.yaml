services:
  mongodb:
    image: mongo:7.0
    container_name: attendance_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=attendance_db
      - JWT_SECRET_KEY=production-secure-random-secret-key-32-chars-long!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - COMPANY_TIMEZONE=Asia/Kolkata
      - POLICY_REQUIRED_DAYS=3
      - POLICY_REQUIRED_HOURS=15.0
      - EMAIL_PROVIDER=smtp
      - EMAIL_FROM=devopspractices26@gmail.com
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=devopspractices26@gmail.com
      - SMTP_PASSWORD=uehn jthv zfyf hcrp
      - SMTP_USE_TLS=true
      - SCHEDULER_ENABLED=true
      - ATTENDANCE_CHECK_SCHEDULE=0 2 * * 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local
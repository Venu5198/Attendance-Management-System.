[project]
name = "attendance-management-backend"
version = "1.0.0"
description = "Centralized Employee Attendance Management and WFH Compliance Backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # Allow FastAPI Depends/Query in function parameter defaults
    "E501",  # Allow long lines in string templates and test seed data
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
